name: C站 Krea2 热门榜每日刷新

# 每天自动从 Civitai 拉取 Krea 2 日 / 周 / 月热门榜，更新 civitai-krea2-data.json。
# 09:44（北京时间）= 01:44 UTC，与原 Muse 空间版收集器的刷新时间一致。
on:
  workflow_dispatch:
  schedule:
    - cron: "44 1 * * *"

permissions:
  contents: write

concurrency:
  group: civitai-krea2-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取榜单生成数据
        run: node scripts/fetch-civitai-krea2.mjs

      - name: 数据有变化才提交
        run: |
          if git diff --quiet -- civitai-krea2-data.json; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add civitai-krea2-data.json
          git commit -m "刷新 C站 Krea2 热门榜数据"
          git push
